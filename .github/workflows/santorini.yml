name: Santorini infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: Plan or apply an approved binary plan
        type: choice
        options: [plan, request-apply, apply]
        required: true
      request_id:
        description: Santorini request UUID
        required: true
        type: string
      commit_sha:
        description: Exact request branch commit SHA
        required: true
        type: string
      plan_run_id:
        description: Successful plan run ID (apply only)
        required: false
        type: string
      plan_sha:
        description: Approved tfplan SHA256 (apply only)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: santorini-${{ inputs.request_id }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  REQUEST_ACTION: ${{ inputs.action }}
  REQUEST_ID: ${{ inputs.request_id }}
  COMMIT_SHA: ${{ inputs.commit_sha }}
  PLAN_SHA: ${{ inputs.plan_sha }}
  PLAN_RUN_ID: ${{ inputs.plan_run_id }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch inputs and branch binding
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "$REQUEST_ACTION" =~ ^(plan|request-apply|apply)$ ]]
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REF_NAME" == "santorini/$REQUEST_ID" ]]
          [[ "$GITHUB_SHA" == "$COMMIT_SHA" ]]
          if [[ "$REQUEST_ACTION" != 'plan' ]]; then
            [[ "$PLAN_SHA" =~ ^[0-9a-f]{64}$ ]]
            [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]
          fi

  plan:
    if: inputs.action == 'plan'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: Assume read-only S3 plan role with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SANTORINI_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.SANTORINI_STATE_REGION }}
          role-session-name: santorini-plan-broker
      - name: Initialize and create immutable plan
        working-directory: .santorini/requests/${{ inputs.request_id }}
        env:
          STATE_BUCKET: ${{ vars.SANTORINI_STATE_BUCKET }}
          STATE_REGION: ${{ vars.SANTORINI_STATE_REGION }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STATE_BUCKET" && test -n "$STATE_REGION"
          TARGET_ACCOUNT=$(node -p 'JSON.parse(require("fs").readFileSync("request.json")).inputs.accountId')
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          [[ "$ACTUAL_ACCOUNT" == "$TARGET_ACCOUNT" ]]
          terraform init -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$STATE_REGION" -backend-config="key=santorini/$REQUEST_ID/terraform.tfstate" -backend-config="use_lockfile=true"
          terraform fmt -recursive
          terraform validate
          terraform plan -out=tfplan -lock-timeout=5m
          terraform show -json tfplan > plan.json
          node <<'NODE'
          const fs = require('fs'); const crypto = require('crypto');
          const request = JSON.parse(fs.readFileSync('request.json'));
          const planSha = crypto.createHash('sha256').update(fs.readFileSync('tfplan')).digest('hex');
          fs.writeFileSync('metadata.json',JSON.stringify({requestId:request.id,commitSha:process.env.COMMIT_SHA,planSha,sourceSha:request.sourceSha,accountId:request.inputs.accountId,region:request.inputs.region,generatedAt:new Date().toISOString()},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: santorini-plan-${{ inputs.request_id }}-${{ inputs.commit_sha }}
          path: |
            .santorini/requests/${{ inputs.request_id }}/tfplan
            .santorini/requests/${{ inputs.request_id }}/plan.json
            .santorini/requests/${{ inputs.request_id }}/metadata.json
            .santorini/requests/${{ inputs.request_id }}/.terraform.lock.hcl
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  request-apply:
    if: inputs.action == 'request-apply'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # A bot-triggered protected run permits human review with self-review blocked.
      - name: Dispatch protected apply as GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('/tmp/dispatch.json',JSON.stringify({ref:process.env.GITHUB_REF_NAME,inputs:{action:'apply',request_id:process.env.REQUEST_ID,commit_sha:process.env.COMMIT_SHA,plan_run_id:process.env.PLAN_RUN_ID,plan_sha:process.env.PLAN_SHA}}));
          NODE
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/santorini.yml/dispatches" --input /tmp/dispatch.json

  apply:
    if: inputs.action == 'apply'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    # Configure required reviewers and prevent self-review before enabling apply.
    environment: santorini-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: Verify the successful plan run identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID" > /tmp/plan-run.json
          node <<'NODE'
          const fs = require('fs'); const r = JSON.parse(fs.readFileSync('/tmp/plan-run.json'));
          if (r.conclusion !== 'success' || r.event !== 'workflow_dispatch' || r.head_sha !== process.env.COMMIT_SHA || r.head_branch !== `santorini/${process.env.REQUEST_ID}` || r.path !== '.github/workflows/santorini.yml') throw Error('Plan run identity mismatch');
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: santorini-plan-${{ inputs.request_id }}-${{ inputs.commit_sha }}
          path: .santorini/requests/${{ inputs.request_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}
      - name: Verify exact approved artifact before obtaining AWS credentials
        working-directory: .santorini/requests/${{ inputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs'); const crypto = require('crypto');
          const meta = JSON.parse(fs.readFileSync('metadata.json'));
          const request = JSON.parse(fs.readFileSync('request.json'));
          const sha = crypto.createHash('sha256').update(fs.readFileSync('tfplan')).digest('hex');
          if (sha !== process.env.PLAN_SHA || meta.planSha !== sha || meta.commitSha !== process.env.COMMIT_SHA || meta.requestId !== process.env.REQUEST_ID || meta.sourceSha !== request.sourceSha || meta.accountId !== request.inputs.accountId || meta.region !== request.inputs.region) throw Error('Approved plan metadata or binary SHA mismatch');
          NODE
      - name: Assume S3 apply role with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SANTORINI_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.SANTORINI_STATE_REGION }}
          role-session-name: santorini-apply-broker
      - name: Apply exact approved binary plan
        working-directory: .santorini/requests/${{ inputs.request_id }}
        env:
          STATE_BUCKET: ${{ vars.SANTORINI_STATE_BUCKET }}
          STATE_REGION: ${{ vars.SANTORINI_STATE_REGION }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STATE_BUCKET" && test -n "$STATE_REGION"
          TARGET_ACCOUNT=$(node -p 'JSON.parse(require("fs").readFileSync("request.json")).inputs.accountId')
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          [[ "$ACTUAL_ACCOUNT" == "$TARGET_ACCOUNT" ]]
          terraform init -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$STATE_REGION" -backend-config="key=santorini/$REQUEST_ID/terraform.tfstate" -backend-config="use_lockfile=true"
          terraform apply -input=false -lock-timeout=5m tfplan
          terraform output -json > outputs.json
          node <<'NODE'
          require('fs').writeFileSync('deployment.json',JSON.stringify({requestId:process.env.REQUEST_ID,commitSha:process.env.COMMIT_SHA,planSha:process.env.PLAN_SHA,planRunId:process.env.PLAN_RUN_ID,completedAt:new Date().toISOString()},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: santorini-outputs-${{ inputs.request_id }}-${{ inputs.commit_sha }}
          path: |
            .santorini/requests/${{ inputs.request_id }}/outputs.json
            .santorini/requests/${{ inputs.request_id }}/deployment.json
          retention-days: 30
